<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archives | NOOR MODESTE | Collections</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/noor.css">
    <script src="js/noor.js" defer></script>
</head>
<body class="antialiased">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 w-full z-50 px-10 py-8 flex justify-between items-center noor-glass">
        <a href="index.html" class="text-2xl font-bold tracking-widest text-noor-text uppercase italic">Noor.</a>
        <div class="hidden md:flex space-x-12 text-[10px] uppercase font-bold tracking-[0.3em] text-noor-text">
            <a href="index.html" class="hover:text-noor-gold transition-colors">Home</a>
            <a href="collections.html" class="text-noor-gold">Archives</a>
            <a href="about.html" class="hover:text-noor-gold transition-colors">The Vision</a>
            <a href="contact.html" class="hover:text-noor-gold transition-colors">Connect</a>
        </div>
    </nav>

    <!-- Header -->
    <header class="pt-48 pb-20 px-10 text-center">
        <div class="noor-reveal">
            <h1 class="text-6xl md:text-8xl font-normal text-noor-text uppercase tracking-widest leading-none mb-6">THE <span class="italic font-bold">ARCHIVES.</span></h1>
            <p class="text-noor-gold text-xs font-bold uppercase tracking-[0.4em]">A chronological study of modest innovation.</p>
        </div>
    </header>

    <!-- Grid -->
    <section class="pb-40 px-10">
        <div class="container mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16">
            <!-- Collection Item 1 -->
            <div class="noor-reveal group">
                <div class="bg-white p-6 shadow-xl border border-noor-accent mb-8 group-hover:-rotate-2 transition-transform duration-500">
                    <div class="aspect-[3/4] overflow-hidden mb-6">
                        <img src="https://images.unsplash.com/photo-1544441893-675973e31985?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="Archive 01" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-1000">
                    </div>
                    <div class="flex justify-between items-end">
                        <div>
                            <h3 class="text-xl font-bold text-noor-text uppercase tracking-tighter">Oasis Linen</h3>
                            <p class="text-[10px] text-noor-gold uppercase font-bold tracking-widest">Archive 2024</p>
                        </div>
                        <span class="text-[10px] text-noor-text/40 font-bold uppercase">#01</span>
                    </div>
                </div>
            </div>

            <!-- Collection Item 2 -->
            <div class="noor-reveal group" style="transition-delay: 100ms;">
                <div class="bg-white p-6 shadow-xl border border-noor-accent mb-8 group-hover:rotate-2 transition-transform duration-500">
                    <div class="aspect-[3/4] overflow-hidden mb-6">
                        <img src="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="Archive 02" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-1000">
                    </div>
                    <div class="flex justify-between items-end">
                        <div>
                            <h3 class="text-xl font-bold text-noor-text uppercase tracking-tighter">Silk Sands</h3>
                            <p class="text-[10px] text-noor-gold uppercase font-bold tracking-widest">Archive 2023</p>
                        </div>
                        <span class="text-[10px] text-noor-text/40 font-bold uppercase">#02</span>
                    </div>
                </div>
            </div>

            <!-- Collection Item 3 -->
            <div class="noor-reveal group" style="transition-delay: 200ms;">
                <div class="bg-white p-6 shadow-xl border border-noor-accent mb-8 group-hover:-rotate-1 transition-transform duration-500">
                    <div class="aspect-[3/4] overflow-hidden mb-6">
                        <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="Archive 03" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-1000">
                    </div>
                    <div class="flex justify-between items-end">
                        <div>
                            <h3 class="text-xl font-bold text-noor-text uppercase tracking-tighter">Midnight Dusk</h3>
                            <p class="text-[10px] text-noor-gold uppercase font-bold tracking-widest">Archive 2023</p>
                        </div>
                        <span class="text-[10px] text-noor-text/40 font-bold uppercase">#03</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-20 px-10 text-center border-t border-noor-accent">
        <div class="text-[10px] uppercase tracking-[0.5em] text-noor-text/40 font-bold">
            &copy; 2024 NOOR MODESTE. ALL RIGHTS RESERVED.
        </div>
    </footer>

</body>
</html>
