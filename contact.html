<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect | NOOR MODESTE | Collaborations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/noor.css">
    <script src="js/noor.js" defer></script>
</head>
<body class="antialiased">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 w-full z-50 px-10 py-8 flex justify-between items-center noor-glass">
        <a href="index.html" class="text-2xl font-bold tracking-widest text-noor-text uppercase italic">Noor.</a>
        <div class="hidden md:flex space-x-12 text-[10px] uppercase font-bold tracking-[0.3em] text-noor-text">
            <a href="index.html" class="hover:text-noor-gold transition-colors">Home</a>
            <a href="collections.html" class="hover:text-noor-gold transition-colors">Archives</a>
            <a href="about.html" class="hover:text-noor-gold transition-colors">The Vision</a>
            <a href="contact.html" class="text-noor-gold">Connect</a>
        </div>
    </nav>

    <!-- Content -->
    <main class="min-h-screen flex items-center px-10 pt-20">
        <div class="container mx-auto grid grid-cols-1 lg:grid-cols-2 gap-20 w-full">
            <div class="noor-reveal">
                <h1 class="text-6xl md:text-8xl font-normal text-noor-text uppercase leading-[0.9] mb-10 tracking-widest">START A <br> <span class="italic font-bold text-noor-gold">Dialogue.</span></h1>
                <p class="text-noor-text/60 text-lg font-light leading-relaxed mb-12">
                    For collaborations, editorial enquiries, or private consultations. Let's create something ethereal together.
                </p>
                <div class="space-y-6">
                    <div>
                        <span class="text-[10px] uppercase font-bold tracking-[0.3em] text-noor-gold block mb-2">Direct Link</span>
                        <a href="mailto:studio@noormodeste.com" class="text-2xl font-light text-noor-text hover:text-noor-gold transition-colors italic">studio@noormodeste.com</a>
                    </div>
                </div>
            </div>

            <div class="noor-reveal noor-glass p-12 rounded-[60px] shadow-2xl">
                <form class="space-y-8">
                    <div class="space-y-2">
                        <label class="text-[10px] uppercase font-bold tracking-[0.3em] text-noor-gold ml-4">Full Identity</label>
                        <input type="text" placeholder="Your Name" class="w-full bg-noor-sand/50 border border-noor-accent rounded-full px-8 py-5 text-noor-text outline-none focus:ring-2 focus:ring-noor-gold transition-all font-light">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] uppercase font-bold tracking-[0.3em] text-noor-gold ml-4">The Request</label>
                        <textarea placeholder="Tell me about your vision..." rows="5" class="w-full bg-noor-sand/50 border border-noor-accent rounded-[30px] px-8 py-5 text-noor-text outline-none focus:ring-2 focus:ring-noor-gold transition-all font-light"></textarea>
                    </div>
                    <button type="submit" class="w-full btn-noor">Transmit Vision</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-20 px-10 text-center border-t border-noor-accent">
        <div class="text-[10px] uppercase tracking-[0.5em] text-noor-text/40 font-bold">
            &copy; 2024 NOOR MODESTE. CONNECTION ESTABLISHED.
        </div>
    </footer>

</body>
</html>
